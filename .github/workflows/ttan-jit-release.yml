# ttan-jit 설치 파일 빌드·배포.
# 태그 ttan-jit/v* 를 푸시하면 Windows(.exe)·macOS(.dmg) 를 빌드해 GitHub Releases 에 올린다.
name: ttan-jit release

on:
  push:
    tags:
      - 'ttan-jit/v*'

permissions:
  contents: write

defaults:
  run:
    working-directory: apps/ttan-jit

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
            files: apps/ttan-jit/dist/*.exe
          - os: macos-latest
            script: build:mac
            files: apps/ttan-jit/dist/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/ttan-jit/package-lock.json

      - run: npm ci

      - run: npm test

      # 서명하지 않는다 (ARCHITECTURE.md > 주요 결정). 인증서 자동 탐색을 끈다.
      - run: npm run ${{ matrix.script }} -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: softprops/action-gh-release@v2
        with:
          name: 짜달시리 딴짓 ${{ github.ref_name }}
          files: ${{ matrix.files }}
